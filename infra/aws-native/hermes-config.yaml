model:
  default: global.anthropic.claude-haiku-4-5-20251001-v1:0
  provider: bedrock
  base_url: https://bedrock-runtime.ap-south-1.amazonaws.com
bedrock:
  region: ap-south-1
  discovery:
    enabled: true
    provider_filter:
      - anthropic
    refresh_interval: 3600
plugins:
  enabled:
    - axcas
platform_toolsets:
  whatsapp_cloud:
    - axcas
agent:
  disabled_toolsets:
    - terminal
    - web
    - browser
    - computer
    - code_execution
    - filesystem
